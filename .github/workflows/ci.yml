name: Infrastructure CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-shell-scripts:
    name: ShellCheck Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on all shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./"
          severity: warning

  validate-configs:
    name: YAML & Nginx Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cloudflared YAML template
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint nginx
          yamllint -d "{extends: relaxed, rules: {document-start: disable, line-length: {max: 120}}}" cloudflared/config.example.yml

      - name: Validate Nginx virtual host syntax
        run: |
          sudo mkdir -p /var/www/davidnicolini.com.br
          sudo cp nginx/sites-available/davidnicolini.conf /etc/nginx/sites-enabled/davidnicolini.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
